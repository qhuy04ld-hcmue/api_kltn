<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>THPT Multimedia</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-3">
    <span class="navbar-brand">THPT Multimedia</span>
    <a href="/login" class="btn btn-light">Admin</a>
</nav>

<div class="container mt-4">

<div class="row mb-3">
<div class="col-md-9">
<input type="text" id="keyword" class="form-control" placeholder="Search keyword...">
</div>
<div class="col-md-3">
<button onclick="searchKeyword()" class="btn btn-primary w-100">Search</button>
</div>
</div>

<div class="row mb-3">
<div class="col-md-3"><input id="class_id" class="form-control" placeholder="C10"></div>
<div class="col-md-3"><input id="subject_id" class="form-control" placeholder="C10-TIN"></div>
<div class="col-md-3"><input id="topic_id" class="form-control" placeholder="C10-TIN-T01"></div>
<div class="col-md-3">
<button onclick="filterLessons()" class="btn btn-success w-100">Filter</button>
</div>
</div>

<table class="table table-bordered shadow">
<thead class="table-dark">
<tr>
<th>Lesson ID</th>
<th>Name</th>
<th>Files</th>
</tr>
</thead>
<tbody id="result"></tbody>
</table>

</div>

<div class="modal fade" id="fileModal">
<div class="modal-dialog modal-xl">
<div class="modal-content">
<div class="modal-body" id="fileViewer"></div>
</div>
</div>
</div>

<script src="/static/js/user.js"></script>
</body>
</html>
