<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CRUD</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body onload="checkAdmin()">

<div class="container mt-4">

<h3>Insert Lesson</h3>

<form id="insertForm">
<input name="class_number" class="form-control mb-2" placeholder="Class Number">
<input name="subject_code" class="form-control mb-2" placeholder="Subject Code">
<input name="topic_order" class="form-control mb-2" placeholder="Topic Order">
<input name="lesson_order" class="form-control mb-2" placeholder="Lesson Order">
<input name="lesson_name" class="form-control mb-2" placeholder="Lesson Name">
<textarea name="description" class="form-control mb-2" placeholder="Description"></textarea>
<input type="file" name="file" class="form-control mb-2">
<button class="btn btn-primary">Insert</button>
</form>

<hr>

<h3>Update Lesson</h3>

<form id="updateForm">
<input id="update_id" class="form-control mb-2" placeholder="Lesson ID">
<input name="lesson_name" class="form-control mb-2" placeholder="New Lesson Name">
<textarea name="description" class="form-control mb-2" placeholder="New Description"></textarea>
<input type="file" name="file" class="form-control mb-2">
<button class="btn btn-warning">Update</button>
</form>
<hr>
<h3>Soft Delete</h3>
<input id="delete_id" class="form-control mb-2" placeholder="Lesson ID">
<button onclick="softDelete()" class="btn btn-danger">Delete</button>

</div>

<script src="/static/js/auth.js"></script>
<script src="/static/js/crud.js"></script>
</body>
</html>
