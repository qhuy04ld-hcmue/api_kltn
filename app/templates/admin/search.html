{% extends "base_admin.html" %}
{% block content %}

<h4 class="mb-4">Search Lessons</h4>

<div class="card shadow-sm p-3 mb-4">
  <div class="row">
    <div class="col-md-10">
      <input id="q"
             class="form-control"
             placeholder="Enter keyword...">
    </div>
    <div class="col-md-2">
      <button class="btn btn-primary w-100"
              onclick="searchLessons()">
        Search
      </button>
    </div>
  </div>
</div>

<div id="result" class="row"></div>

<script>

async function searchLessons(){

  const keyword = document.getElementById("q").value.trim();
  if(!keyword){
    showToast("Enter keyword","error");
    return;
  }

  const res = await fetch(
    `/api/search/keyword?q=${encodeURIComponent(keyword)}&limit=20&offset=0`
  );

  const json = await res.json();

  renderLessons(json.data || []);
}



function renderLessons(lessons){

  let html = "";

  lessons.forEach(lesson => {

    let fileButtons = "";

    if(Array.isArray(lesson.files)){

      lesson.files.forEach(file => {

        if(!file.file_url || !file.bucket) return;

        // Lấy path từ file_url
        const url = new URL(file.file_url);
        const path = url.pathname.replace(`/${file.bucket}/`, "");

        fileButtons += `
          <button class="btn btn-sm btn-outline-primary me-2 mb-2"
            onclick="window.open('/api/file/view/${file.bucket}/${path}','_blank')">
            ${file.file_name}
          </button>
        `;
      });
    }

    html += `
      <div class="col-md-6">
        <div class="card shadow-sm mb-4">
          <div class="card-body">

            <h5 class="text-primary">${lesson.lesson_name}</h5>

            <div class="text-muted small mb-2">
              ${lesson.class_id} |
              ${lesson.subject_id} |
              ${lesson.topic_id}
            </div>

            <div>
              ${fileButtons || "<span class='text-muted'>No files</span>"}
            </div>

          </div>
        </div>
      </div>
    `;
  });

  document.getElementById("result").innerHTML = html;
}

</script>

{% endblock %}
