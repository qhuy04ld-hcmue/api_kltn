{% extends "base_admin.html" %}
{% block content %}

<h4 class="mb-3">MongoDB Manager</h4>

<div class="row">
  <!-- LEFT: COLLECTION LIST -->
  <div class="col-md-4">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white">
        Collections
      </div>
      <ul id="collectionList" class="list-group list-group-flush">
        <li class="list-group-item text-muted">Loading...</li>
      </ul>
    </div>
  </div>

  <!-- RIGHT: DOCUMENTS -->
  <div class="col-md-8">
    <div id="docsContainer"></div>
  </div>
</div>

<script>
const collectionList = document.getElementById("collectionList");
const docsContainer = document.getElementById("docsContainer");

async function loadCollections(){
  try{
    const res = await fetch("/api/file/mongo");
    if(!res.ok){
      collectionList.innerHTML = "<li class='list-group-item text-danger'>Error loading</li>";
      return;
    }

    const cols = await res.json();
    collectionList.innerHTML = "";

    if(cols.length === 0){
      collectionList.innerHTML = "<li class='list-group-item'>No collections</li>";
      return;
    }

    cols.forEach(c=>{
      collectionList.innerHTML += `
        <li class="list-group-item list-group-item-action"
            style="cursor:pointer"
            onclick="loadDocs('${c}')">
          ${c}
        </li>
      `;
    });

  }catch(err){
    collectionList.innerHTML = "<li class='list-group-item text-danger'>Connection error</li>";
  }
}

async function loadDocs(col){
  docsContainer.innerHTML = `
    <div class="text-center mt-4">
      <div class="spinner-border text-primary"></div>
    </div>
  `;

  try{
    const res = await fetch(`/api/file/mongo/${col}`);
    if(!res.ok){
      docsContainer.innerHTML = "<p class='text-danger'>Error loading documents</p>";
      return;
    }

    const docs = await res.json();

    if(docs.length === 0){
      docsContainer.innerHTML = `
        <div class="alert alert-info">
          No documents in this collection.
        </div>
      `;
      return;
    }

    let html = "";

    docs.forEach(d=>{
      html += `
        <div class="card shadow-sm mb-3">
          <div class="card-header bg-light">
            <strong>ID:</strong> ${d._id}
          </div>
          <div class="card-body">
            <div class="row">
              ${Object.keys(d).map(key=>{
                if(key === "_id") return "";
                return `
                  <div class="col-md-6 mb-2">
                    <div class="border rounded p-2 bg-white">
                      <small class="text-muted">${key}</small><br>
                      <span>${formatValue(d[key])}</span>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>
          </div>
        </div>
      `;
    });

    docsContainer.innerHTML = html;

  }catch(err){
    docsContainer.innerHTML = "<p class='text-danger'>Connection error</p>";
  }
}

function formatValue(value){
  if(typeof value === "object"){
    return `<pre class="mb-0">${JSON.stringify(value,null,2)}</pre>`;
  }
  return value;
}

loadCollections();
</script>

{% endblock %}
