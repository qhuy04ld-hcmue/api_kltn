<!DOCTYPE html>
<html>
<head>
  <title>Admin Panel</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background:#f4f6f9; }
    .sidebar {
      width:240px;
      height:100vh;
      position:fixed;
      background:#1e293b;
      padding-top:20px;
    }
    .sidebar a {
      color:#cbd5e1;
      padding:12px 20px;
      display:block;
      text-decoration:none;
    }
    .sidebar a:hover {
      background:#334155;
      color:white;
    }
    .content {
      margin-left:260px;
      padding:30px;
    }
    .card { border-radius:12px; }
  </style>
</head>
<body>

<div class="sidebar">
  <h5 class="text-white text-center mb-4">Admin Panel</h5>

  <a href="/admin"><i class="bi bi-speedometer2"></i> Dashboard</a>

  <hr class="text-secondary">

  <a href="/admin/search"><i class="bi bi-search"></i> Search</a>
  <a href="/admin/filter"><i class="bi bi-funnel"></i> Filter</a>

  <hr class="text-secondary">

  <a href="/admin/crud"><i class="bi bi-pencil-square"></i> Lesson CRUD</a>
  <a href="/admin/upload"><i class="bi bi-upload"></i> Upload</a>
  <a href="/admin/import"><i class="bi bi-file-earmark-zip"></i> Import ZIP</a>

  <hr class="text-secondary">

  <a href="/admin/postgres"><i class="bi bi-database"></i> PostgreSQL</a>
  <a href="/admin/mongo"><i class="bi bi-hdd-stack"></i> MongoDB</a>
  <a href="/admin/minio"><i class="bi bi-folder2-open"></i> MinIO</a>
  <a href="/admin/neo4j"><i class="bi bi-diagram-3"></i> Neo4j Graph</a>

  <hr class="text-secondary">

  <a href="/logout" class="text-danger"><i class="bi bi-box-arrow-left"></i> Logout</a>
</div>

<div class="content">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
function showToast(message, type="success"){
  alert(message);
}
</script>

</body>
</html>
