<!DOCTYPE html>
<html>
<head>
  <title>MultiDB System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand text-white" href="/">MultiDB</a>

  <div class="ms-auto">
    {% if request.cookies.get("admin") %}
        <a class="btn btn-warning me-2" href="/admin">Admin Dashboard</a>
        <a class="btn btn-danger" href="/logout">Logout</a>
    {% else %}
        <a class="btn btn-success" href="/login">Admin Login</a>
    {% endif %}
  </div>
</nav>

<div class="container mt-4">
{% block content %}{% endblock %}
</div>

</body>
</html>
